<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEALTH PLUS — Observe. Understand. Guide.</title>
    <meta name="description" content="AI-Powered Personal Health and Wellness Platform by CASA Vital. Observe your nutrition and exercise, understand your historical patterns, and receive grounded wellness guidance." />
    <!-- Google Fonts: Manrope (Headings) and Inter (Interface & Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('healthplus_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || (!stored)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ivory dark:bg-[#05130F] text-forest dark:text-[#E8F2EC] antialiased selection:bg-emerald/20 selection:text-forest">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
